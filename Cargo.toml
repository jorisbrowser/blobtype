[workspace]
resolver = "2"
members = ["crates/blobtype-core", "crates/blobtype-input", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jorisbrowser/blobtype"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
